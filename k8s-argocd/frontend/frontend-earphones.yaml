apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-earphones
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/amit6264/google-store-DevOps-project-1.git
    path: frontend/earphones
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: google
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
