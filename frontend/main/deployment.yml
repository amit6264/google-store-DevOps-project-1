apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-frontend-deployment
  labels:
    app: main-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: main-frontend
  template:
    metadata:
      labels:
        app: main-frontend
    spec:
      containers:
      - name: main-frontend
        image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-main:7ee4b77fc7d5e056b2db38e370a816d46c7513be
        ports:
        - containerPort: 80

