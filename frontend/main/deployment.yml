apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-frontend-deployment
  labels:
    app: main-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: main-frontend
  template:
    metadata:
      labels:
        app: main-frontend
    spec:
      containers:
      - name: main-frontend
        image: 066380524960.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-main:c0c203d4aa0741b3b2da15a0307c6d727c6f95fd
        ports:
        - containerPort: 80

