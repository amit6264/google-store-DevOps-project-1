apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-frontend-deployment
  labels:
    app: main-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: main-frontend
  template:
    metadata:
      labels:
        app: main-frontend
    spec:
      containers:
      - name: main-frontend
        image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-main:9e58e8227f7775a57a53c212d671eb09ce644142
        ports:
        - containerPort: 80

