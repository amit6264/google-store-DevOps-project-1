apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-frontend-deployment
  labels:
    app: main-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: main-frontend
  template:
    metadata:
      labels:
        app: main-frontend
    spec:
      containers:
      - name: main-frontend
        image: 066380524960.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-main:b1e65f0f0e7220391cceaded7073583459c23958
        ports:
        - containerPort: 80

