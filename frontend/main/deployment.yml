apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-frontend-deployment
  labels:
    app: main-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: main-frontend
  template:
    metadata:
      labels:
        app: main-frontend
    spec:
      containers:
      - name: main-frontend
        image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-main:f97e85cf5a986da6e0af5f71dfdc510dfd6f7a40
        ports:
        - containerPort: 80

