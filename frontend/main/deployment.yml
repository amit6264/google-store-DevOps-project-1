apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-frontend-deployment
  labels:
    app: main-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: main-frontend
  template:
    metadata:
      labels:
        app: main-frontend
    spec:
      containers:
      - name: main-frontend
        image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-main:513c177b7ff8e90eceea7b3a0f3bf25bfed5ebb8
        ports:
        - containerPort: 80

