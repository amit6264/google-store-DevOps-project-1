apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-frontend-deployment
  labels:
    app: main-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: main-frontend
  template:
    metadata:
      labels:
        app: main-frontend
    spec:
      containers:
      - name: main-frontend
        image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-main:b2f08a6ff3b9f05e08c72187b5e0cad9eae5070e
        ports:
        - containerPort: 80

