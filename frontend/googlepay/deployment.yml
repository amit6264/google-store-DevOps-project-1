apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlepay-deployment
  labels:
    app: googlepay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlepay
  template:
    metadata:
      labels:
        app: googlepay
    spec:
      containers:
      - name: googlepay
        image: 066380524960.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-googlepay:9494773bd5713f7c809bf0da6868948f76fd1c34
        ports:
        - containerPort: 80
