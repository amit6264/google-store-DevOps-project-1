apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlepay-deployment
  labels:
    app: googlepay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlepay
  template:
    metadata:
      labels:
        app: googlepay
    spec:
      containers:
      - name: googlepay
        image: 066380524960.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-googlepay:c0c203d4aa0741b3b2da15a0307c6d727c6f95fd
        ports:
        - containerPort: 80
