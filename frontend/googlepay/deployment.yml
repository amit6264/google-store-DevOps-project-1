apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlepay-deployment
  labels:
    app: googlepay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlepay
  template:
    metadata:
      labels:
        app: googlepay
    spec:
      containers:
      - name: googlepay
        image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-googlepay:7ee4b77fc7d5e056b2db38e370a816d46c7513be
        ports:
        - containerPort: 80
