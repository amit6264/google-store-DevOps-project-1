apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlepay-deployment
  labels:
    app: googlepay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlepay
  template:
    metadata:
      labels:
        app: googlepay
    spec:
      containers:
      - name: googlepay
        image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-googlepay:513c177b7ff8e90eceea7b3a0f3bf25bfed5ebb8
        ports:
        - containerPort: 80
