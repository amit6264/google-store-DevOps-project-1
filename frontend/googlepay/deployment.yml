apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlepay-deployment
  labels:
    app: googlepay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlepay
  template:
    metadata:
      labels:
        app: googlepay
    spec:
      containers:
      - name: googlepay
        image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-googlepay:9e58e8227f7775a57a53c212d671eb09ce644142
        ports:
        - containerPort: 80
