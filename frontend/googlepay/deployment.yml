apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlepay-deployment
  labels:
    app: googlepay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlepay
  template:
    metadata:
      labels:
        app: googlepay
    spec:
      containers:
      - name: googlepay
        image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-googlepay:f97e85cf5a986da6e0af5f71dfdc510dfd6f7a40
        ports:
        - containerPort: 80
