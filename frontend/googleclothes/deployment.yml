apiVersion: apps/v1
kind: Deployment
metadata:
  name: googleclothes-deployment
  labels:
    app: googleclothes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googleclothes
  template:
    metadata:
      labels:
        app: googleclothes
    spec:
      containers:
      - name: googleclothes
        image: 066380524960.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-googleclothes:b1e65f0f0e7220391cceaded7073583459c23958
        ports:
        - containerPort: 80
