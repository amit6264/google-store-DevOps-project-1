apiVersion: apps/v1
kind: Deployment
metadata:
  name: googleclothes-deployment
  labels:
    app: googleclothes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googleclothes
  template:
    metadata:
      labels:
        app: googleclothes
    spec:
      containers:
      - name: googleclothes
        image: 066380524960.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-googleclothes:c0c203d4aa0741b3b2da15a0307c6d727c6f95fd
        ports:
        - containerPort: 80
