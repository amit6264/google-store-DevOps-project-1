apiVersion: apps/v1
kind: Deployment
metadata:
  name: googleclothes-deployment
  labels:
    app: googleclothes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googleclothes
  template:
    metadata:
      labels:
        app: googleclothes
    spec:
      containers:
      - name: googleclothes
        image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-googleclothes:b2f08a6ff3b9f05e08c72187b5e0cad9eae5070e
        ports:
        - containerPort: 80
