apiVersion: apps/v1
kind: Deployment
metadata:
  name: googleclothes-deployment
  labels:
    app: googleclothes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googleclothes
  template:
    metadata:
      labels:
        app: googleclothes
    spec:
      containers:
      - name: googleclothes
        image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-googleclothes:7ee4b77fc7d5e056b2db38e370a816d46c7513be
        ports:
        - containerPort: 80
