apiVersion: apps/v1
kind: Deployment
metadata:
  name: googleclothes-deployment
  labels:
    app: googleclothes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googleclothes
  template:
    metadata:
      labels:
        app: googleclothes
    spec:
      containers:
      - name: googleclothes
        image: 066380524960.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-googleclothes:9494773bd5713f7c809bf0da6868948f76fd1c34
        ports:
        - containerPort: 80
