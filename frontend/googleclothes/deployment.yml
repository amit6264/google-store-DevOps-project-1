apiVersion: apps/v1
kind: Deployment
metadata:
  name: googleclothes-deployment
  labels:
    app: googleclothes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googleclothes
  template:
    metadata:
      labels:
        app: googleclothes
    spec:
      containers:
      - name: googleclothes
        image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-googleclothes:9e58e8227f7775a57a53c212d671eb09ce644142
        ports:
        - containerPort: 80
