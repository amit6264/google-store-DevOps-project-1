  name: phones-deployment
  labels:
    app: phones
spec:
  replicas: 2
  selector:
    matchLabels:
      app: phones
  template:
    metadata:
      labels:
        app: phones
    spec:
      containers:
      - name: phones
        image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-phones:9e58e8227f7775a57a53c212d671eb09ce644142
        ports:
        - containerPort: 80
