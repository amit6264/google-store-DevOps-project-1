  name: phones-deployment
  labels:
    app: phones
spec:
  replicas: 2
  selector:
    matchLabels:
      app: phones
  template:
    metadata:
      labels:
        app: phones
    spec:
      containers:
      - name: phones
        image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-phones:7ee4b77fc7d5e056b2db38e370a816d46c7513be
        ports:
        - containerPort: 80
