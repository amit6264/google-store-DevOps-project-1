apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlegrocery-deployment
  labels:
    app: googlegrocery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlegrocery
  template:
    metadata:
      labels:
        app: googlegrocery
    spec:
      containers:
      - name: googlegrocery
        image: 066380524960.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-googlegrocery:c0c203d4aa0741b3b2da15a0307c6d727c6f95fd
        ports:
        - containerPort: 80
