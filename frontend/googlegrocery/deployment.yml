apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlegrocery-deployment
  labels:
    app: googlegrocery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlegrocery
  template:
    metadata:
      labels:
        app: googlegrocery
    spec:
      containers:
      - name: googlegrocery
        image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-googlegrocery:513c177b7ff8e90eceea7b3a0f3bf25bfed5ebb8
        ports:
        - containerPort: 80
