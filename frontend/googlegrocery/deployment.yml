apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlegrocery-deployment
  labels:
    app: googlegrocery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlegrocery
  template:
    metadata:
      labels:
        app: googlegrocery
    spec:
      containers:
      - name: googlegrocery
        image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-googlegrocery:7ee4b77fc7d5e056b2db38e370a816d46c7513be
        ports:
        - containerPort: 80
