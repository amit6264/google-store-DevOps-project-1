apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlegrocery-deployment
  labels:
    app: googlegrocery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlegrocery
  template:
    metadata:
      labels:
        app: googlegrocery
    spec:
      containers:
      - name: googlegrocery
        image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-googlegrocery:f97e85cf5a986da6e0af5f71dfdc510dfd6f7a40
        ports:
        - containerPort: 80
