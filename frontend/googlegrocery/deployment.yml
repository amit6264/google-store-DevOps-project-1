apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlegrocery-deployment
  labels:
    app: googlegrocery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlegrocery
  template:
    metadata:
      labels:
        app: googlegrocery
    spec:
      containers:
      - name: googlegrocery
        image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-googlegrocery:b2f08a6ff3b9f05e08c72187b5e0cad9eae5070e
        ports:
        - containerPort: 80
