apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlemusic-deployment
  labels:
    app: googlemusic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlemusic
  template:
    metadata:
      labels:
        app: googlemusic
    spec:
      containers:
      - name: googlemusic
        image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-googlemusic:d566a0dda63a455cfed0a21bc99a1baaebcadf92
        ports:
        - containerPort: 80
