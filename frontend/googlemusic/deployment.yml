apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlemusic-deployment
  labels:
    app: googlemusic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlemusic
  template:
    metadata:
      labels:
        app: googlemusic
    spec:
      containers:
      - name: googlemusic
        image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-googlemusic:1aa3cb1bb27f9ac79147c3f3c79b3c907fc3b80b
        ports:
        - containerPort: 80
