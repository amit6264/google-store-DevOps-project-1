apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlemusic-deployment
  labels:
    app: googlemusic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlemusic
  template:
    metadata:
      labels:
        app: googlemusic
    spec:
      containers:
      - name: googlemusic
        image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-googlemusic:7ee4b77fc7d5e056b2db38e370a816d46c7513be
        ports:
        - containerPort: 80
