apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlemusic-deployment
  labels:
    app: googlemusic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlemusic
  template:
    metadata:
      labels:
        app: googlemusic
    spec:
      containers:
      - name: googlemusic
        image: 066380524960.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-googlemusic:9494773bd5713f7c809bf0da6868948f76fd1c34
        ports:
        - containerPort: 80
