apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlemusic-deployment
  labels:
    app: googlemusic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlemusic
  template:
    metadata:
      labels:
        app: googlemusic
    spec:
      containers:
      - name: googlemusic
        image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-googlemusic:f97e85cf5a986da6e0af5f71dfdc510dfd6f7a40
        ports:
        - containerPort: 80
