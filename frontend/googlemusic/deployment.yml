apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlemusic-deployment
  labels:
    app: googlemusic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlemusic
  template:
    metadata:
      labels:
        app: googlemusic
    spec:
      containers:
      - name: googlemusic
        image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-googlemusic:b2f08a6ff3b9f05e08c72187b5e0cad9eae5070e
        ports:
        - containerPort: 80
