apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend-container
          image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-backend:7ee4b77fc7d5e056b2db38e370a816d46c7513be
          ports:
            - containerPort: 5000
