apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend-container
          image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-backend:d566a0dda63a455cfed0a21bc99a1baaebcadf92
          ports:
            - containerPort: 5000
