apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend-container
          image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-backend:9e58e8227f7775a57a53c212d671eb09ce644142
          ports:
            - containerPort: 5000
