apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend-container
          image: 066380524960.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-backend:c0c203d4aa0741b3b2da15a0307c6d727c6f95fd
          ports:
            - containerPort: 5000
