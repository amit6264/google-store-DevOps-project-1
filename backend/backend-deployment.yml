apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend-container
          image: 066380524960.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-backend:9494773bd5713f7c809bf0da6868948f76fd1c34
          ports:
            - containerPort: 5000
