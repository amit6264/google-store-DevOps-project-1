apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend-container
          image: 066380524960.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-backend:b1e65f0f0e7220391cceaded7073583459c23958
          ports:
            - containerPort: 5000
