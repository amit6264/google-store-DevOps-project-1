apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend-container
          image: 744420879952.dkr.ecr.eu-north-1.amazonaws.com/shopping-site-backend:b2f08a6ff3b9f05e08c72187b5e0cad9eae5070e
          ports:
            - containerPort: 5000
